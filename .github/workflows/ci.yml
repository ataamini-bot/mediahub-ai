name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mediahub_test
          POSTGRES_USER: mediahub_test
          POSTGRES_PASSWORD: mediahub_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediahub_test -d mediahub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: test-secret-key
      JWT_SECRET_KEY: test-jwt-secret-key
      POSTGRES_DB: mediahub_test
      POSTGRES_USER: mediahub_test
      POSTGRES_PASSWORD: mediahub_test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+asyncpg://mediahub_test:mediahub_test_password@127.0.0.1:5432/mediahub_test
      REDIS_URL: redis://127.0.0.1:6379/0
      TELEGRAM_BOT_TOKEN: 123456789:test-token
      TELEGRAM_SUPERADMIN_ID: "123456789"
      BOT_BACKEND_API_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      DATA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      ADMIN_NOTIFICATIONS_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            bot/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r bot/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/alembic bot/app

      - name: Validate and apply migrations
        working-directory: backend
        run: |
          alembic heads
          alembic upgrade head
          alembic current

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q

      - name: Run bot tests
        env:
          PYTHONPATH: bot
        run: python -m pytest bot/tests -q
